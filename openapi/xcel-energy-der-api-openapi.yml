openapi: 3.2.0
info:
  title: Xcel Energy Smart Meter IEEE 2030.5 DER API
  summary: IEEE 2030.5 (SEP 2.0) REST API exposed by Itron Gen 5 Riva smart meters on the local network.
  description: IEEE 2030.5 / Smart Energy Profile 2.0 compliant API server built into Itron Gen 5 Riva smart meters deployed by Xcel Energy.
  version: '1.0'
  contact:
    name: Xcel Energy Developer Portal
    url: https://developer-apim.aws.xcelenergy.com/
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
  x-standards:
  - IEEE 2030.5-2018
  - Smart Energy Profile 2.0
servers:
- url: https://{meterHost}
  description: Itron Gen 5 Riva smart meter on the local network (mTLS).
  variables:
    meterHost:
      default: 192.168.1.10
      description: Hostname or IP of the local meter device.
tags:
- name: DER
  description: Distributed Energy Resource programs, controls, and settings.
paths:
  /derp:
    get:
      operationId: listDERPrograms
      summary: List DER programs
      description: Returns the DERProgramList — programs that schedule controls for distributed energy resources such as PV and storage.
      tags:
      - DER
      security:
      - mtls: []
      parameters:
      - $ref: '#/components/parameters/StartIndex'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: DERProgramList resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/DERProgramList'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /derp/{derpId}:
    get:
      operationId: getDERProgram
      summary: Get a DER program
      tags:
      - DER
      security:
      - mtls: []
      parameters:
      - $ref: '#/components/parameters/DerpId'
      responses:
        '200':
          description: DERProgram resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/DERProgram'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /derp/{derpId}/derc:
    get:
      operationId: listDERControls
      summary: List DERControls for a DER program
      tags:
      - DER
      security:
      - mtls: []
      parameters:
      - $ref: '#/components/parameters/DerpId'
      responses:
        '200':
          description: DERControlList resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/DERControlList'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /der:
    get:
      operationId: listDERs
      summary: List Distributed Energy Resources
      tags:
      - DER
      security:
      - mtls: []
      parameters:
      - $ref: '#/components/parameters/StartIndex'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: DERList resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/DERList'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Link:
      type: object
      description: Link to another resource in the IEEE 2030.5 graph.
      properties:
        href:
          type: string
    DERProgram:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          mRID:
            type: string
          description:
            type: string
          version:
            type: integer
          primacy:
            type: integer
          DefaultDERControlLink:
            $ref: '#/components/schemas/Link'
          DERControlListLink:
            $ref: '#/components/schemas/Link'
          DERCurveListLink:
            $ref: '#/components/schemas/Link'
          ActiveDERControlListLink:
            $ref: '#/components/schemas/Link'
    DERControlList:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          all:
            type: integer
          results:
            type: integer
          DERControl:
            type: array
            items:
              type: object
              properties:
                mRID:
                  type: string
                description:
                  type: string
                creationTime:
                  type: integer
                EventStatus:
                  type: object
                  properties:
                    currentStatus:
                      type: integer
                    dateTime:
                      type: integer
                    potentiallySuperseded:
                      type: boolean
                interval:
                  type: object
                  properties:
                    duration:
                      type: integer
                    start:
                      type: integer
                randomizeStart:
                  type: integer
                randomizeDuration:
                  type: integer
                DERControlBase:
                  type: object
                  description: DERControlBase parameter set (opModConnect
                  opModEnergize: null
                  opModFixedPFAbsorbW: null
                  opModMaxLimW: null
                  etc.).: null
    DERList:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          all:
            type: integer
          results:
            type: integer
          DER:
            type: array
            items:
              type: object
              properties:
                AssociatedDERProgramListLink:
                  $ref: '#/components/schemas/Link'
                AssociatedUsagePointLink:
                  $ref: '#/components/schemas/Link'
                CurrentDERProgramLink:
                  $ref: '#/components/schemas/Link'
                DERAvailabilityLink:
                  $ref: '#/components/schemas/Link'
                DERStatusLink:
                  $ref: '#/components/schemas/Link'
                DERSettingsLink:
                  $ref: '#/components/schemas/Link'
                DERCapabilityLink:
                  $ref: '#/components/schemas/Link'
    DERProgramList:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          all:
            type: integer
          results:
            type: integer
          DERProgram:
            type: array
            items:
              $ref: '#/components/schemas/DERProgram'
    Resource:
      type: object
      description: Base IEEE 2030.5 Resource type that all resources inherit from.
      properties:
        href:
          type: string
          description: Stable URI of the resource.
  parameters:
    DerpId:
      name: derpId
      in: path
      required: true
      description: Identifier of a DERProgram resource.
      schema:
        type: integer
        minimum: 0
        example: 0
    Limit:
      name: l
      in: query
      required: false
      description: Maximum number of list items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 255
        example: 25
    StartIndex:
      name: s
      in: query
      required: false
      description: 0-based start index for paginated lists.
      schema:
        type: integer
        minimum: 0
        example: 0
  responses:
    NotFound:
      description: The requested resource was not found.
  securitySchemes:
    mtls:
      type: mutualTLS
      description: 'IEEE 2030.5 requires mutual TLS authentication. Clients present a device certificate whose subject contains the LFDI/SFDI used to authorize access. Plain HTTP is not permitted.

        '
