openapi: 3.2.0
info:
  title: Xcel Energy Smart Meter IEEE 2030.5 Device Capability API
  summary: IEEE 2030.5 (SEP 2.0) REST API exposed by Itron Gen 5 Riva smart meters on the local network.
  description: IEEE 2030.5 / Smart Energy Profile 2.0 compliant API server built into Itron Gen 5 Riva smart meters deployed by Xcel Energy.
  version: '1.0'
  contact:
    name: Xcel Energy Developer Portal
    url: https://developer-apim.aws.xcelenergy.com/
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
  x-standards:
  - IEEE 2030.5-2018
  - Smart Energy Profile 2.0
servers:
- url: https://{meterHost}
  description: Itron Gen 5 Riva smart meter on the local network (mTLS).
  variables:
    meterHost:
      default: 192.168.1.10
      description: Hostname or IP of the local meter device.
tags:
- name: DeviceCapability
  description: Root resource that lists the function sets supported by the meter.
paths:
  /dcap:
    get:
      operationId: getDeviceCapability
      summary: Get the device capability index
      description: Returns the DeviceCapability resource — the root of the IEEE 2030.5 link graph. Clients use this resource to discover the URIs of all supported function sets on the meter.
      tags:
      - DeviceCapability
      security:
      - mtls: []
      responses:
        '200':
          description: DeviceCapability resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/DeviceCapability'
            application/sep-exi:
              schema:
                $ref: '#/components/schemas/DeviceCapability'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  responses:
    Unauthorized:
      description: TLS authentication failed or the client certificate is not authorized.
  schemas:
    Link:
      type: object
      description: Link to another resource in the IEEE 2030.5 graph.
      properties:
        href:
          type: string
    Resource:
      type: object
      description: Base IEEE 2030.5 Resource type that all resources inherit from.
      properties:
        href:
          type: string
          description: Stable URI of the resource.
    DeviceCapability:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          pollRate:
            type: integer
            example: 900
            description: Recommended poll rate in seconds.
          EndDeviceListLink:
            $ref: '#/components/schemas/Link'
          SelfDeviceLink:
            $ref: '#/components/schemas/Link'
          TimeLink:
            $ref: '#/components/schemas/Link'
          MirrorUsagePointListLink:
            $ref: '#/components/schemas/Link'
          UsagePointListLink:
            $ref: '#/components/schemas/Link'
          DERProgramListLink:
            $ref: '#/components/schemas/Link'
          DemandResponseProgramListLink:
            $ref: '#/components/schemas/Link'
          MessagingProgramListLink:
            $ref: '#/components/schemas/Link'
          ResponseSetListLink:
            $ref: '#/components/schemas/Link'
  securitySchemes:
    mtls:
      type: mutualTLS
      description: 'IEEE 2030.5 requires mutual TLS authentication. Clients present a device certificate whose subject contains the LFDI/SFDI used to authorize access. Plain HTTP is not permitted.

        '
