openapi: 3.2.0
info:
  title: Xcel Energy Smart Meter IEEE 2030.5 Messaging API
  summary: IEEE 2030.5 (SEP 2.0) REST API exposed by Itron Gen 5 Riva smart meters on the local network.
  description: IEEE 2030.5 / Smart Energy Profile 2.0 compliant API server built into Itron Gen 5 Riva smart meters deployed by Xcel Energy.
  version: '1.0'
  contact:
    name: Xcel Energy Developer Portal
    url: https://developer-apim.aws.xcelenergy.com/
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
  x-standards:
  - IEEE 2030.5-2018
  - Smart Energy Profile 2.0
servers:
- url: https://{meterHost}
  description: Itron Gen 5 Riva smart meter on the local network (mTLS).
  variables:
    meterHost:
      default: 192.168.1.10
      description: Hostname or IP of the local meter device.
tags:
- name: Messaging
  description: Text and HTML messages targeted at end-users.
paths:
  /msg:
    get:
      operationId: listMessagingPrograms
      summary: List messaging programs
      description: Returns the MessagingProgramList — text and HTML messages targeted at end-users.
      tags:
      - Messaging
      security:
      - mtls: []
      responses:
        '200':
          description: MessagingProgramList resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/MessagingProgramList'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Resource:
      type: object
      description: Base IEEE 2030.5 Resource type that all resources inherit from.
      properties:
        href:
          type: string
          description: Stable URI of the resource.
    MessagingProgramList:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          all:
            type: integer
          results:
            type: integer
          MessagingProgram:
            type: array
            items:
              type: object
              properties:
                mRID:
                  type: string
                description:
                  type: string
                primacy:
                  type: integer
                ActiveTextMessageListLink:
                  $ref: '#/components/schemas/Link'
                TextMessageListLink:
                  $ref: '#/components/schemas/Link'
    Link:
      type: object
      description: Link to another resource in the IEEE 2030.5 graph.
      properties:
        href:
          type: string
  securitySchemes:
    mtls:
      type: mutualTLS
      description: 'IEEE 2030.5 requires mutual TLS authentication. Clients present a device certificate whose subject contains the LFDI/SFDI used to authorize access. Plain HTTP is not permitted.

        '
