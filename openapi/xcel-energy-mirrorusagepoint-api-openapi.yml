openapi: 3.2.0
info:
  title: Xcel Energy Smart Meter IEEE 2030.5 Mirror Usage Point API
  summary: IEEE 2030.5 (SEP 2.0) REST API exposed by Itron Gen 5 Riva smart meters on the local network.
  description: IEEE 2030.5 / Smart Energy Profile 2.0 compliant API server built into Itron Gen 5 Riva smart meters deployed by Xcel Energy.
  version: '1.0'
  contact:
    name: Xcel Energy Developer Portal
    url: https://developer-apim.aws.xcelenergy.com/
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
  x-standards:
  - IEEE 2030.5-2018
  - Smart Energy Profile 2.0
servers:
- url: https://{meterHost}
  description: Itron Gen 5 Riva smart meter on the local network (mTLS).
  variables:
    meterHost:
      default: 192.168.1.10
      description: Hostname or IP of the local meter device.
tags:
- name: MirrorUsagePoint
  description: Client-supplied mirror usage points used to publish readings to the server.
paths:
  /mup:
    get:
      operationId: listMirrorUsagePoints
      summary: List MirrorUsagePoints
      description: Returns the MirrorUsagePointList — client-supplied mirror points used to publish readings to the server.
      tags:
      - MirrorUsagePoint
      security:
      - mtls: []
      responses:
        '200':
          description: MirrorUsagePointList resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/MirrorUsagePointList'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createMirrorUsagePoint
      summary: Create a MirrorUsagePoint
      description: Posts a new MirrorUsagePoint to publish readings.
      tags:
      - MirrorUsagePoint
      security:
      - mtls: []
      requestBody:
        required: true
        content:
          application/sep+xml:
            schema:
              $ref: '#/components/schemas/MirrorUsagePoint'
      responses:
        '201':
          description: MirrorUsagePoint created.
          headers:
            Location:
              schema:
                type: string
              description: URI of the new MirrorUsagePoint resource.
        '400':
          $ref: '#/components/responses/BadRequest'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /mup/{mupId}:
    post:
      operationId: postMirrorMeterReading
      summary: Publish a MirrorMeterReading
      description: Posts a MirrorMeterReading containing readings to be published against the MirrorUsagePoint.
      tags:
      - MirrorUsagePoint
      security:
      - mtls: []
      parameters:
      - $ref: '#/components/parameters/MupId'
      requestBody:
        required: true
        content:
          application/sep+xml:
            schema:
              $ref: '#/components/schemas/MirrorMeterReading'
      responses:
        '201':
          description: Mirror reading accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    MirrorUsagePoint:
      allOf:
      - $ref: '#/components/schemas/UsagePoint'
      - type: object
        properties:
          deviceLFDI:
            type: string
            description: LFDI of the device publishing the readings.
          postRate:
            type: integer
          MirrorMeterReading:
            type: array
            items:
              $ref: '#/components/schemas/MirrorMeterReading'
    Link:
      type: object
      description: Link to another resource in the IEEE 2030.5 graph.
      properties:
        href:
          type: string
    MirrorUsagePointList:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          all:
            type: integer
          results:
            type: integer
          MirrorUsagePoint:
            type: array
            items:
              $ref: '#/components/schemas/MirrorUsagePoint'
    UsagePoint:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          mRID:
            type: string
          description:
            type: string
          version:
            type: integer
          roleFlags:
            type: string
            description: Hex-encoded RoleFlagsType bit field.
          serviceCategoryKind:
            type: integer
            description: 0=electricity, 1=gas, 2=water, 3=pressure, 4=heat, 5=cold, 6=communication, 7=time.
          status:
            type: integer
          MeterReadingListLink:
            $ref: '#/components/schemas/Link'
    Resource:
      type: object
      description: Base IEEE 2030.5 Resource type that all resources inherit from.
      properties:
        href:
          type: string
          description: Stable URI of the resource.
    MirrorMeterReading:
      type: object
      properties:
        mRID:
          type: string
        description:
          type: string
        lastUpdateTime:
          type: integer
        nextUpdateTime:
          type: integer
        ReadingType:
          type: object
          properties:
            accumulationBehaviour:
              type: integer
            commodity:
              type: integer
            dataQualifier:
              type: integer
            flowDirection:
              type: integer
            intervalLength:
              type: integer
            kind:
              type: integer
            phase:
              type: integer
            powerOfTenMultiplier:
              type: integer
            uom:
              type: integer
        Reading:
          type: object
          properties:
            timePeriod:
              type: object
              properties:
                duration:
                  type: integer
                start:
                  type: integer
            value:
              type: integer
        MirrorReadingSet:
          type: array
          items:
            type: object
            properties:
              mRID:
                type: string
              timePeriod:
                type: object
                properties:
                  duration:
                    type: integer
                  start:
                    type: integer
              Reading:
                type: array
                items:
                  type: object
                  properties:
                    timePeriod:
                      type: object
                      properties:
                        duration:
                          type: integer
                        start:
                          type: integer
                    value:
                      type: integer
                    qualityFlags:
                      type: string
  parameters:
    MupId:
      name: mupId
      in: path
      required: true
      description: Identifier of a MirrorUsagePoint resource.
      schema:
        type: integer
        minimum: 0
        example: 0
  responses:
    BadRequest:
      description: The request body or parameters were invalid.
  securitySchemes:
    mtls:
      type: mutualTLS
      description: 'IEEE 2030.5 requires mutual TLS authentication. Clients present a device certificate whose subject contains the LFDI/SFDI used to authorize access. Plain HTTP is not permitted.

        '
