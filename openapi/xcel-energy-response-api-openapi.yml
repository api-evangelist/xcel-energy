openapi: 3.2.0
info:
  title: Xcel Energy Smart Meter IEEE 2030.5 Response API
  summary: IEEE 2030.5 (SEP 2.0) REST API exposed by Itron Gen 5 Riva smart meters on the local network.
  description: IEEE 2030.5 / Smart Energy Profile 2.0 compliant API server built into Itron Gen 5 Riva smart meters deployed by Xcel Energy.
  version: '1.0'
  contact:
    name: Xcel Energy Developer Portal
    url: https://developer-apim.aws.xcelenergy.com/
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
  x-standards:
  - IEEE 2030.5-2018
  - Smart Energy Profile 2.0
servers:
- url: https://{meterHost}
  description: Itron Gen 5 Riva smart meter on the local network (mTLS).
  variables:
    meterHost:
      default: 192.168.1.10
      description: Hostname or IP of the local meter device.
tags:
- name: Response
  description: Acknowledgement responses for received events.
paths:
  /rsp:
    get:
      operationId: listResponseSets
      summary: List ResponseSets
      tags:
      - Response
      security:
      - mtls: []
      responses:
        '200':
          description: ResponseSetList resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/ResponseSetList'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: postResponse
      summary: Post a Response acknowledgement
      description: Posts a Response acknowledging receipt or completion of a server-issued event.
      tags:
      - Response
      security:
      - mtls: []
      requestBody:
        required: true
        content:
          application/sep+xml:
            schema:
              $ref: '#/components/schemas/Response'
      responses:
        '201':
          description: Response recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    Link:
      type: object
      description: Link to another resource in the IEEE 2030.5 graph.
      properties:
        href:
          type: string
    ResponseSetList:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          all:
            type: integer
          results:
            type: integer
          ResponseSet:
            type: array
            items:
              type: object
              properties:
                mRID:
                  type: string
                description:
                  type: string
                ResponseListLink:
                  $ref: '#/components/schemas/Link'
    Resource:
      type: object
      description: Base IEEE 2030.5 Resource type that all resources inherit from.
      properties:
        href:
          type: string
          description: Stable URI of the resource.
    Response:
      type: object
      properties:
        createdDateTime:
          type: integer
        endDeviceLFDI:
          type: string
        status:
          type: integer
        subject:
          type: string
  responses:
    BadRequest:
      description: The request body or parameters were invalid.
  securitySchemes:
    mtls:
      type: mutualTLS
      description: 'IEEE 2030.5 requires mutual TLS authentication. Clients present a device certificate whose subject contains the LFDI/SFDI used to authorize access. Plain HTTP is not permitted.

        '
