openapi: 3.2.0
info:
  title: Xcel Energy Smart Meter IEEE 2030.5 Subscription API
  summary: IEEE 2030.5 (SEP 2.0) REST API exposed by Itron Gen 5 Riva smart meters on the local network.
  description: IEEE 2030.5 / Smart Energy Profile 2.0 compliant API server built into Itron Gen 5 Riva smart meters deployed by Xcel Energy.
  version: '1.0'
  contact:
    name: Xcel Energy Developer Portal
    url: https://developer-apim.aws.xcelenergy.com/
  x-generated-from: documentation
  x-last-validated: '2026-05-03'
  x-standards:
  - IEEE 2030.5-2018
  - Smart Energy Profile 2.0
servers:
- url: https://{meterHost}
  description: Itron Gen 5 Riva smart meter on the local network (mTLS).
  variables:
    meterHost:
      default: 192.168.1.10
      description: Hostname or IP of the local meter device.
tags:
- name: Subscription
  description: Subscription/notification resources for resource-change events.
paths:
  /sub:
    get:
      operationId: listSubscriptions
      summary: List Subscriptions
      description: Returns the SubscriptionList describing client subscriptions to resource-change notifications.
      tags:
      - Subscription
      security:
      - mtls: []
      responses:
        '200':
          description: SubscriptionList resource.
          content:
            application/sep+xml:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      operationId: createSubscription
      summary: Create a Subscription
      tags:
      - Subscription
      security:
      - mtls: []
      requestBody:
        required: true
        content:
          application/sep+xml:
            schema:
              $ref: '#/components/schemas/Subscription'
      responses:
        '201':
          description: Subscription created.
          headers:
            Location:
              schema:
                type: string
              description: URI of the new Subscription resource.
        '400':
          $ref: '#/components/responses/BadRequest'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /sub/{subId}:
    delete:
      operationId: deleteSubscription
      summary: Delete a Subscription
      tags:
      - Subscription
      security:
      - mtls: []
      parameters:
      - $ref: '#/components/parameters/SubId'
      responses:
        '204':
          description: Subscription removed.
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    SubId:
      name: subId
      in: path
      required: true
      description: Identifier of a Subscription resource.
      schema:
        type: integer
        minimum: 0
        example: 0
  schemas:
    Subscription:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          subscribedResource:
            type: string
            description: URI of the resource being subscribed to.
          encoding:
            type: integer
            description: 0=application/sep+xml, 1=application/sep-exi.
          level:
            type: string
          limit:
            type: integer
          notificationURI:
            type: string
            description: Client URI to which Notification POSTs are delivered.
    SubscriptionList:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        properties:
          all:
            type: integer
          results:
            type: integer
          Subscription:
            type: array
            items:
              $ref: '#/components/schemas/Subscription'
    Resource:
      type: object
      description: Base IEEE 2030.5 Resource type that all resources inherit from.
      properties:
        href:
          type: string
          description: Stable URI of the resource.
  responses:
    BadRequest:
      description: The request body or parameters were invalid.
    NotFound:
      description: The requested resource was not found.
  securitySchemes:
    mtls:
      type: mutualTLS
      description: 'IEEE 2030.5 requires mutual TLS authentication. Clients present a device certificate whose subject contains the LFDI/SFDI used to authorize access. Plain HTTP is not permitted.

        '
